<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title-app-icon">
  <title id="title-app-icon">Blip App Icon</title>
  <defs>
    <!-- Background tile gradient -->
    <linearGradient id="tile-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161822"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Subtle ambient glow behind notch -->
    <radialGradient id="ambient-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#4cc9f0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>

    <!-- Island capsule fill -->
    <linearGradient id="island-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e222e"/>
      <stop offset="100%" stop-color="#0d0f15"/>
    </linearGradient>

    <!-- Eyes gradient -->
    <linearGradient id="eyes-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80e5ff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- Container squircle (Windows 11 / modern desktop tile) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient pulse halo -->
  <ellipse cx="256" cy="256" rx="210" ry="140" fill="url(#ambient-cyan)"/>

  <!-- Living Island Capsule -->
  <rect x="70" y="152" width="372" height="208" rx="104" fill="url(#island-fill)"/>
  <rect x="70" y="152" width="372" height="208" rx="104" fill="none" stroke="rgba(128,229,255,0.24)" stroke-width="2"/>

  <!-- Twin Glowing Mascot Eyes -->
  <rect x="170" y="214" width="46" height="84" rx="23" fill="url(#eyes-glow)"/>
  <rect x="296" y="214" width="46" height="84" rx="23" fill="url(#eyes-glow)"/>
</svg>
