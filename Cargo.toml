[package]
name = "blip"
version = "0.2.0"
description = "Blip - dynamic island AI assistant"
edition = "2021"
license = "MIT"
repository = "https://github.com/caidenniw/blip-notch"

[build-dependencies]
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "multipart", "json", "rustls-tls"] }
futures-util = "0.3"
cpal = "0.15"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"] }
arboard = "3"
regex = "1"
tiny_http = "0.12"
drag = "2.1.1"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
windows-future = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_WinRT",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Imaging_D2D",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Globalization",
  "Win32_Devices_FunctionDiscovery",
  "Networking",
  "Networking_Connectivity",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_System_Wmi",
  "Devices_Enumeration",
  "Devices_Bluetooth",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies.windows-numerics]
version = "0.3"
