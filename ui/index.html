<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Blip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-state="idle" data-page="chat">
  <div id="island">
    <div class="clip">
      <div class="ambient"></div>

      <!-- collapsed pill -->
      <div class="row layer" id="row">
        <span class="idle-clock" id="idleClock"><b id="icTime">--:--</b><span id="icDate"></span></span>
        <div class="eyes" id="mascot"><i class="eye"></i><i class="eye"></i></div>
        <img class="mini-art" id="miniArt" alt="" />
        <div class="label">
          <span id="title">Blip</span>
          <span id="detail"></span>
        </div>
        <i class="live-ring" id="liveRing" aria-hidden="true"></i>
        <div class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="wave" id="wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>

      <!-- system HUD -->
      <div class="hud layer" id="hud">
        <svg class="hud-ic" id="hudIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
        <span class="hud-label" id="hudLabel"></span>
        <span class="hud-bar" id="hudBarWrap"><i id="hudBar"></i></span>
        <span class="hud-val" id="hudVal"></span>
      </div>

      <!-- expanded notch -->
      <div class="open layer">
        <div class="hdr">
          <div class="eyes mini" id="miniEyes"><i class="eye"></i><i class="eye"></i></div>
          <span id="pageTitle">Obrolan</span>
          <span class="grow"></span>
          <button class="nav" id="pinBtn" title="Sematkan" aria-label="Sematkan"><svg viewBox="0 0 24 24"><path d="M16 12V4H8v8l-2 2v2h5v6l1 1 1-1v-6h5v-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
          <span id="batt"></span>
          <span id="clock">--:--</span>
        </div>

        <div class="pages">
          <section class="pg" data-p="music">
            <div class="mleft">
              <div class="mrow">
                <img class="art" id="art" alt="" />
                <div class="meta">
                  <b id="mTitle"></b>
                  <span id="mArtist"></span>
                  <span class="app"><span id="mApp"></span><span id="lyrNote"></span></span>
                </div>
              </div>
              <div class="mbar">
                <span class="t" id="mPos">0:00</span>
                <div class="prog" id="prog" title="Geser posisi"><i id="progFill"></i></div>
                <span class="t" id="mLeft">-0:00</span>
              </div>
              <div class="ctl" id="media">
                <button id="lyrBtn" title="Lirik" aria-label="Lirik"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
                <button data-cmd="prev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M11 6 3 12l8 6zM21 6l-8 6 8 6z"/></svg></button>
                <button data-cmd="toggle" aria-label="Putar/Jeda"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
                <button data-cmd="next" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="m13 6 8 6-8 6zM3 6l8 6-8 6z"/></svg></button>
                <span class="lyr-sync" id="lyrSync"><button id="lyrMinus" title="Lirik lebih lambat" aria-label="Lirik lebih lambat">−</button><output id="lyrOff" title="Klik dua kali untuk reset">0.0s</output><button id="lyrPlus" title="Lirik lebih awal" aria-label="Lirik lebih awal">+</button></span>
              </div>
            </div>
            <div class="lyr-wrap">
              <ol class="lyr scroll" id="lyrList"></ol>
              <span class="lyr-status" id="lyrStatus"></span>
            </div>
          </section>

          <section class="pg focus-pg" data-p="focus">
            <div class="pring" id="fRing"><div class="pin"><span id="fTime">25:00</span></div></div>
            <div class="fmeta">
              <div class="fhead"><b id="fPhase">Fokus</b><span id="fCount">sesi 1/4</span></div>
              <div class="chips">
                <button data-ph="focus">Fokus 25</button>
                <button data-ph="short">Istirahat 5</button>
                <button data-ph="long">Panjang 15</button>
              </div>
              <div class="frow">
                <div class="fdur" id="fdur"><button id="fMinus" aria-label="Kurangi 5 menit">−</button><input id="fMin" type="number" min="1" max="120" step="1" aria-label="Menit"/><span>mnt</span><button id="fPlus" aria-label="Tambah 5 menit">+</button></div>
                <div class="fbtns">
                  <button class="pill" id="fStart">Mulai</button>
                  <button class="pill ghost" id="fReset">Reset</button>
                  <button class="pill ghost" id="fSkip">Lewati</button>
                </div>
              </div>
            </div>
          </section>

          <section class="pg todo-pg" data-p="todo">
            <div class="phead">
              <span id="todoCount">0/0 selesai</span>
              <button class="link" id="todoClear">Hapus selesai</button>
            </div>
            <div class="tadd"><input class="tin" id="todoIn" placeholder="Tugas baru… (@14:30)" /><button class="pill" id="todoAdd">Tambah</button></div>
            <div class="tlist scroll" id="todoList"></div>
          </section>

          <section class="pg water-pg" data-p="water">
            <div class="wtop">
              <div class="wbig"><b id="wBig">0.00 / 2.0 L</b><span id="wPct">0%</span></div>
              <div class="wbtns">
                <button class="pill" id="wDrink">+250 ml</button>
                <button class="pill ghost" id="wUndo">Batal</button>
                <button class="icn" id="wSet" title="Pengaturan" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
              </div>
            </div>
            <div class="wbar"><i id="wBar"></i></div>
            <div class="wchart" id="wChart"></div>
            <div class="wform" id="wForm">
              <label>target <input id="wGoal" type="number" min="500" max="6000" step="100" /></label>
              <label>gelas <input id="wCup" type="number" min="50" max="1000" step="50" /></label>
              <label>tiap <input id="wEvery" type="number" min="15" max="240" step="5" /> mnt</label>
            </div>
          </section>

          <section class="pg shelf-pg" data-p="shelf">
            <div class="phead">
              <span id="shelfCount"></span>
              <button class="link" id="shelfPaste">Tempel</button>
              <button class="link" id="shelfClear">Bersihkan</button>
            </div>
            <div class="zone" id="shelfEmpty">
              <b>Tarik file ke sini</b>
              <span>Tempel file dari clipboard, atau tarik ke sini</span>
            </div>
            <div class="slist scroll" id="shelfList"></div>
          </section>

          <section class="pg chat-pg" data-p="chat">
            <div class="messages scroll" id="messages"></div>
            <div class="composer">
              <textarea id="input" rows="1" placeholder="Tulis atau tekan Ctrl Kanan…"></textarea>
              <button class="icon" id="mic" title="Bicara" aria-label="Bicara"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
              <button class="icon primary" id="send" title="Kirim" aria-label="Kirim"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
            </div>
            <div class="footer">
              <span id="model"></span>
              <button class="link" id="ttsToggle">suara: on</button>
            </div>
          </section>
        </div>

        <nav class="page-nav" id="pageNav" aria-label="Halaman Blip"></nav>
      </div>

      <div class="answer layer" id="answer"></div>
    </div>
  </div>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
