name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - shell: pwsh
        run: |
          choco install nsis -y
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$ver installer\blip.nsi
      - uses: softprops/action-gh-release@v2
        with:
          name: Blip ${{ github.ref_name }}
          body: 'Unsigned Windows installer. SmartScreen: More info -> Run anyway. First run creates %APPDATA%\Blip\blip.config.json; set router.apiKey.'
          draft: true
          prerelease: false
          files: installer/Blip_*_x64-setup.exe
